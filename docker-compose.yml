services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      - qdrant
    init: true
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  huggingface_cache:
  qdrant_storage:
